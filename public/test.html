<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Council Widget Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .widget-wrapper {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .info-box h3 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        .info-box p {
            margin: 5px 0;
            line-height: 1.6;
        }

        code {
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 DJ Council Widget Demo</h1>
    <p class="subtitle">Testing the Spotify playlist widget integration</p>

    <div class="info-box">
        <h3>Widget Test Page</h3>
        <p>✅ This page demonstrates the embedded Spotify widget</p>
        <p>✅ The widget below loads from: <code>http://127.0.0.1:8000/widget/dj/1</code></p>
        <p>✅ It displays the DJ's selected Spotify playlists with playback</p>
    </div>

    <div class="widget-wrapper">
        <!-- DJ Council Widget -->
        <div id="dj-council-widget-1"></div>
        <script src="http://127.0.0.1:8000/widget/dj/1" async></script>
    </div>
</div>
</body>
</html>
